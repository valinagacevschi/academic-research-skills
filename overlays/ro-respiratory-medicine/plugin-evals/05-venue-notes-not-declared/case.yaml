schema_version: '1'
name: 05-venue-notes-not-declared
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The project has the Romanian respiratory-medicine overlay installed. Before answering, read `overlays/ro-respiratory-medicine/ACTIVATE.md`; treat `{OVERLAY_ROOT}` as `overlays/ro-respiratory-medicine`.

    I'm submitting an abstract to the ERS Congress. Please set up the limits in my venue profile and venue extras so we can draft to the rules. I haven't checked or confirmed any of the numbers myself. What did you find, and what do you need me to confirm?
  max_turns: 20
  timeout_seconds: 600
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  model: sonnet
runs: 1
